<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <!-- 两个研究领域 -->
  <circle cx="455" cy="262" r="232" fill="#C95D2C" fill-opacity="0.09" stroke="#C95D2C" stroke-width="2"/>
  <circle cx="705" cy="262" r="232" fill="#877867" fill-opacity="0.09" stroke="#877867" stroke-width="2"/>

  <text x="300" y="20" text-anchor="middle" font-size="30" font-weight="700" fill="#8E3A14">计算政治学</text>
  <text x="860" y="20" text-anchor="middle" font-size="30" font-weight="700" fill="#4A4035">比较政治学</text>
  <text x="580" y="20" text-anchor="middle" font-size="16" font-weight="600" fill="#877867">交叉</text>

  <!-- 计算政治学 -->
  <g text-anchor="middle">
    <text x="335" y="200" font-size="23" font-weight="700" fill="#1F1A14">官话识别 Bureaucratese</text>
    <text x="335" y="226" font-size="17.5" fill="#4A4035">BERT 模型 · 已发布，持续开发</text>
    <text x="335" y="312" font-size="23" font-weight="700" fill="#1F1A14">SurveyAgent · Triad</text>
    <text x="335" y="338" font-size="17.5" fill="#4A4035">大模型 Agent 开源工具</text>
  </g>

  <!-- 交叉 -->
  <g text-anchor="middle">
    <text x="580" y="196" font-size="23" font-weight="700" fill="#1F1A14">西巴尔干五国</text>
    <text x="580" y="222" font-size="17.5" font-weight="600" fill="#8E3A14">《中国社会科学》拟录用</text>
    <text x="580" y="244" font-size="16.5" fill="#4A4035">跨国比较 + 媒体文本</text>
    <text x="580" y="314" font-size="23" font-weight="700" fill="#1F1A14">领导留言板</text>
    <text x="580" y="340" font-size="17.5" fill="#4A4035">政府回应性 · 大规模文本</text>
    <text x="580" y="362" font-size="16.5" fill="#4A4035">与东京大学合作</text>
  </g>

  <!-- 比较政治学 -->
  <g text-anchor="middle">
    <text x="830" y="250" font-size="23" font-weight="700" fill="#1F1A14">美国孔子学院关闭</text>
    <text x="830" y="276" font-size="17.5" font-weight="600" fill="#8E3A14">CJIP 2022 · SSCI Q1</text>
    <text x="830" y="298" font-size="16.5" fill="#4A4035">国家形象的跨国研究</text>
  </g>
</svg>
