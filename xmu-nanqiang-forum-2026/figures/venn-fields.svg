<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <!-- 两个研究领域 -->
  <circle cx="445" cy="272" r="240" fill="#C95D2C" fill-opacity="0.09" stroke="#C95D2C" stroke-width="2"/>
  <circle cx="715" cy="272" r="240" fill="#877867" fill-opacity="0.10" stroke="#877867" stroke-width="2"/>

  <text x="290" y="22" text-anchor="middle" font-size="30" font-weight="700" fill="#8E3A14">计算政治学</text>
  <text x="870" y="22" text-anchor="middle" font-size="30" font-weight="700" fill="#4A4035">比较政治学</text>

  <!-- 计算政治学：工具 -->
  <g text-anchor="middle">
    <text x="320" y="170" font-size="22" font-weight="700" fill="#1F1A14">官话识别 Bureaucratese</text>
    <text x="320" y="195" font-size="16.5" fill="#4A4035">BERT 模型 · 已发布</text>
    <text x="320" y="268" font-size="22" font-weight="700" fill="#1F1A14">SurveyAgent · Triad</text>
    <text x="320" y="293" font-size="16.5" fill="#4A4035">大模型 Agent 开源工具</text>
    <text x="320" y="366" font-size="22" font-weight="700" fill="#1F1A14">regioncode</text>
    <text x="320" y="391" font-size="16.5" fill="#4A4035">CRAN · 下载 1.7 万+</text>
  </g>

  <!-- 交叉：代表作 -->
  <g text-anchor="middle">
    <text x="580" y="200" font-size="22" font-weight="700" fill="#1F1A14">西巴尔干五国</text>
    <text x="580" y="226" font-size="17" font-weight="700" fill="#8E3A14">《中国社会科学》</text>
    <text x="580" y="248" font-size="15.5" fill="#4A4035">跨国比较 × 媒体文本</text>
    <text x="580" y="322" font-size="22" font-weight="700" fill="#1F1A14">领导留言板</text>
    <text x="580" y="348" font-size="15.5" fill="#4A4035">政府回应性 × 大规模文本</text>
    <text x="580" y="370" font-size="15.5" fill="#4A4035">与东京大学合作</text>
  </g>

  <!-- 比较政治学 -->
  <g text-anchor="middle">
    <text x="842" y="150" font-size="21" font-weight="700" fill="#1F1A14">美国孔子学院关闭</text>
    <text x="842" y="174" font-size="16" font-weight="700" fill="#8E3A14">CJIP · SSCI Q1</text>
    <text x="842" y="236" font-size="21" font-weight="700" fill="#1F1A14">政治社会化实验</text>
    <text x="842" y="260" font-size="16" fill="#4A4035">政治与公共管理研究</text>
    <text x="842" y="322" font-size="21" font-weight="700" fill="#1F1A14">公共服务动机</text>
    <text x="842" y="346" font-size="16" fill="#4A4035">公共管理与政策评论</text>
    <text x="842" y="408" font-size="21" font-weight="700" fill="#1F1A14">地方治理能力比较</text>
    <text x="842" y="432" font-size="16" fill="#4A4035">广州大学学报</text>
  </g>
</svg>
