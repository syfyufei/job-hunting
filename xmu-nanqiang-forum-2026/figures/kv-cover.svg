<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4E96"/>
      <stop offset="0.55" stop-color="#1468B6"/>
      <stop offset="1" stop-color="#3F80C2"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDC68F" stop-opacity="0"/>
      <stop offset="1" stop-color="#EDC68F" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#660874"/>
      <stop offset="0.5" stop-color="#0C62B0"/>
      <stop offset="1" stop-color="#EDC68F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- soft hills -->
  <path d="M0 470 C 180 420 300 450 430 410 S 720 360 880 400 S 1160 380 1280 350 L1280 720 L0 720Z" fill="#FFFFFF" opacity="0.05"/>
  <path d="M0 520 C 220 480 380 510 560 470 S 900 450 1060 480 S 1220 470 1280 455 L1280 720 L0 720Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- sea waves -->
  <g fill="none" stroke="#EDC68F" stroke-linecap="round">
    <path d="M-20 600 C 160 560 320 640 520 600 S 880 560 1060 600 S 1260 630 1300 610" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M-20 625 C 180 590 340 660 540 625 S 900 590 1080 625 S 1260 650 1300 635" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M-20 650 C 200 620 360 680 560 650 S 920 620 1100 650 S 1260 670 1300 660" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Jiageng-style skyline, gold line art (right side) -->
  <g fill="none" stroke="#EDC68F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" transform="translate(720 300)">
    <!-- central tower -->
    <path d="M200 290 V120 H300 V290"/>
    <path d="M188 120 Q 250 92 312 120"/>
    <path d="M196 112 Q 250 70 304 112"/>
    <path d="M214 82 Q 250 46 286 82 L 270 70 L 250 56 L 230 70Z"/>
    <path d="M250 46 V 22"/>
    <path d="M222 150 v30 M250 150 v30 M278 150 v30 M222 205 v30 M250 205 v30 M278 205 v30"/>
    <path d="M232 290 v-30 a18 18 0 0 1 36 0 v30"/>
    <!-- left wing with swallow-tail roof -->
    <path d="M40 290 V200 H200"/>
    <path d="M24 204 Q 40 196 54 186 Q 120 176 186 186 Q 200 196 214 204"/>
    <path d="M24 204 l -8 -12 M214 204 l 8 -12"/>
    <path d="M62 290 v-34 a12 12 0 0 1 24 0 v34 M102 290 v-34 a12 12 0 0 1 24 0 v34 M142 290 v-34 a12 12 0 0 1 24 0 v34"/>
    <!-- right wing -->
    <path d="M300 200 H460 V290"/>
    <path d="M286 204 Q 300 196 314 186 Q 380 176 446 186 Q 460 196 474 204"/>
    <path d="M286 204 l -8 -12 M474 204 l 8 -12"/>
    <path d="M334 290 v-34 a12 12 0 0 1 24 0 v34 M374 290 v-34 a12 12 0 0 1 24 0 v34 M414 290 v-34 a12 12 0 0 1 24 0 v34"/>
    <path d="M0 290 H520"/>
  </g>

  <!-- phoenix-flower line art (top right) -->
  <g fill="none" stroke="#EDC68F" stroke-width="1.3" opacity="0.55" transform="translate(1150 110)">
    <g id="petals">
      <path d="M0 0 C -14 -30 14 -58 0 -78 C 26 -60 30 -24 0 0Z"/>
      <path d="M0 0 C -14 -30 14 -58 0 -78 C 26 -60 30 -24 0 0Z" transform="rotate(72)"/>
      <path d="M0 0 C -14 -30 14 -58 0 -78 C 26 -60 30 -24 0 0Z" transform="rotate(144)"/>
      <path d="M0 0 C -14 -30 14 -58 0 -78 C 26 -60 30 -24 0 0Z" transform="rotate(216)"/>
      <path d="M0 0 C -14 -30 14 -58 0 -78 C 26 -60 30 -24 0 0Z" transform="rotate(288)"/>
    </g>
    <path d="M0 0 q 30 10 52 40 M0 0 q 34 -4 60 14 M0 0 q 22 22 30 56"/>
  </g>
  <g fill="none" stroke="#EDC68F" stroke-width="1.1" opacity="0.35" transform="translate(1040 60) scale(0.55) rotate(20)">
    <use href="#petals"/>
  </g>

  <!-- bottom brand band: Tsinghua purple → Nanqiang blue → champagne gold -->
  <rect x="0" y="712" width="1280" height="8" fill="url(#band)"/>
</svg>
